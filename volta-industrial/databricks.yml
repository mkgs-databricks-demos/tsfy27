# Bundle 1 (infra) — Volta Industrial: schema, volume, data gen, pipeline, metric views, dashboard.
#
# Part of a three-bundle system (see deploy.sh):
#   1. volta-industrial/databricks.yml   ← THIS FILE (infra)
#   2. bundles/genie/databricks.yml      (Genie space — depends on tables existing)
#   3. bundles/app/databricks.yml        (App + AI Gateway — depends on Genie space ID)
#
# Standalone usage:
#   databricks bundle deploy             → schema + raw_data volume + setup job
#   databricks bundle run volta_setup    → generates the synthetic raw data
#
# Full orchestrated deploy:
#   ./deploy.sh --target dev
bundle:
  name: workshop-volta-industrial

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/volta-industrial-workshop

variables:
  catalog:
    description: Unity Catalog for the workshop data (must already exist / you can create it).
    default: ncqai
  schema:
    description: Schema for the demo tables + the raw_data volume (created by this bundle).
    default: volta_industrial

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Workshop — Volta Industrial downtime/maintenance: synthetic plant-telemetry data."

  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.demo_schema.name}
      name: raw_data
      volume_type: MANAGED
      comment: "Raw parquet landing zone — generate_data.py writes here; the SDP silver you build reads it via read_files()."

  jobs:
    volta_setup:
      name: "[Workshop] Volta Industrial — generate data"
      description: "Generates the synthetic raw_* parquet datasets into the raw_data volume. Run this once after deploy, then build the pipeline/Lakebase/app/gateway yourself."
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./data_generation/generate_data_notebook.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.demo_schema.name}
          environment_key: sdk_default
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - numpy
              - pandas
              - faker

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production

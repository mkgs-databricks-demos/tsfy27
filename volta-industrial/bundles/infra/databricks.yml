# Bundle 1: Infrastructure — schema, volume, data gen, SDP pipeline, metric views, dashboard.
# Deploy first. Jobs must complete before Bundle 2 (Genie) can be deployed.
bundle:
  name: volta-infra

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/volta-industrial-workshop/infra

variables:
  catalog:
    description: Unity Catalog for the workshop data.
    default: ncqai
  schema:
    description: Schema for demo tables + raw_data volume.
    default: volta_industrial

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Volta Industrial — synthetic plant-telemetry data."

  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: raw_data
      volume_type: MANAGED
      comment: "Raw parquet landing zone."

  jobs:
    volta_setup:
      name: "[Volta] Generate synthetic data"
      description: "Generates raw_* parquet datasets into raw_data volume."
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../../data_generation/generate_data
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: sdk_default
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - numpy
              - pandas
              - faker

  # TODO: Add pipeline resource once SDP SQL is authored
  # pipelines:
  #   volta_plant_floor:
  #     name: "[Volta] Plant Floor Pipeline"
  #     ...

  # TODO: Add metric view resource
  # TODO: Add dashboard resource

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
